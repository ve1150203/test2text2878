<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公共工程品管班駐班助理提供模擬考題</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #0f172a;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        h2 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            color: #1e293b;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 16px;
            background-color: #fff;
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-secondary { background-color: #64748b; color: white; }

        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 15px;
        }

        .question-item {
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 20px;
            background: #fff;
        }

        .question-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .course-tag {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-weight: normal;
        }

        .paper-tag {
            display: inline-block;
            background: #f1f5f9;
            color: #475569;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-weight: bold;
            margin-right: 5px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-label:hover {
            background-color: #f8fafc;
        }

        .option-label input {
            margin-right: 12px;
            transform: scale(1.2);
        }

        .option-correct {
            background-color: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46;
            font-weight: 600;
        }

        .option-wrong {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b;
        }

        .analysis-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #eff6ff;
            border-left: 4px solid var(--primary);
            border-radius: 0 8px 8px 0;
            font-size: 15px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>公共工程品管班 模擬考系統</h1>
        <p style="color: var(--text-muted);">6/13加油</p>
    </div>

    <div class="card" id="setup-card">
        <h2>📊 設定考卷模式</h2>
        <div class="grid-2">
            <div class="form-group">
                <label for="mode-select">選擇測驗範圍</label>
                <select id="mode-select">
                    <option value="all">全部 200 題混合隨機抽題</option>
                    <option value="paper1">考古題 1</option>
                    <option value="paper2">考古題 2</option>
                </select>
            </div>
            <div class="form-group">
                <label for="count-select">測驗題數</label>
                <select id="count-select">
                    <option value="30">隨機 30 題</option>
                    <option value="50">隨機 50 題</option>
                    <option value="100">隨機 100 題</option>
                    <option value="all">全部考題</option>
                </select>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="feedback-select">回饋模式</label>
                <select id="feedback-select">
                    <option value="instant">練習模式（單題即時對錯與解析）</option>
                    <option value="submit">交卷模式（寫完統一計算與檢視）</option>
                </select>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-primary" onclick="startExam(false)">🚀 開始測驗</button>
            <button class="btn-secondary" id="resume-btn" onclick="resumeLastExam()">Memory 繼續上回測驗</button>
            <button class="btn-danger" id="review-btn" onclick="startExam(true)" disabled>🔥 錯題重測 (<span id="wrong-count-txt">0</span>)</button>
        </div>
    </div>

    <div class="card hidden" id="exam-card">
        <h2 id="exam-title">模擬試卷</h2>
        <div class="stats-bar">
            <div>總題數: <span id="stat-total">0</span></div>
            <div>已作答: <span id="stat-answered">0</span></div>
            <div style="color: var(--success);">答對: <span id="stat-correct">0</span></div>
            <div style="color: var(--danger);">當前錯題本總數: <span id="stat-wrong-pool">0</span></div>
        </div>

        <div id="questions-container"></div>

        <div class="btn-group">
            <button class="btn-success hidden" id="submit-exam-btn" onclick="gradeEntireExam()">✔️ 檢查交卷</button>
            <button class="btn-secondary" onclick="backToSetup()">返回設定選單</button>
        </div>
    </div>
</div>

<script src="quiz_data.js"></script>

<script>
    const allQuestions = typeof quiz_data !== 'undefined' ? quiz_data : [];
    let currentExamQuestions = [];
    let wrongQuestionPool = new Set(); 
    let isReviewMode = false;

    window.onload = function() {
        if (allQuestions.length === 0) {
            alert("⚠️ 偵測不到 quiz_data.js！請確認檔案格式正確且放在同一個資料夾下。");
        }
        loadLocalStorage();
        updateWrongButtonState();
    };

    // 判斷題目來源：有 origId 代表是考古題 1，沒有則是考古題 2
    function getPaperSource(q) {
        return q.hasOwnProperty('origId') ? 'paper1' : 'paper2';
    }

    function cleanOptionText(optKey, text) {
        if (!text) return '';
        const targetPrefix = `(${optKey})`;
        if (text.trim().startsWith(targetPrefix)) {
            return text.trim().substring(targetPrefix.length);
        }
        return text;
    }

    function getCleanId(q) {
        if (!q.id) return Math.random().toString();
        return q.id.toString().replace(/<[^>]*>/g, "").trim();
    }

    function startExam(reviewMode = false) {
        isReviewMode = reviewMode;
        let pool = [];

        if (isReviewMode) {
            pool = allQuestions.filter(q => wrongQuestionPool.has(getCleanId(q)));
        } else {
            const rangeMode = document.getElementById('mode-select').value;
            if (rangeMode === 'all') {
                pool = [...allQuestions];
            } else {
                // 自動依欄位屬性篩選出考古題 1 或 考古題 2
                pool = allQuestions.filter(q => getPaperSource(q) === rangeMode);
            }
        }

        if (pool.length === 0) {
            alert("目前沒有符合設定的題目可抽取！");
            return;
        }

        pool.sort(() => Math.random() - 0.5);
        
        const countLimit = document.getElementById('count-select').value;
        if (countLimit !== 'all' && !isReviewMode) {
            pool = pool.slice(0, Math.min(parseInt(countLimit), pool.length));
        }

        currentExamQuestions = pool.map(q => ({
            ...q, 
            uniqueId: getCleanId(q),
            userAns: null, 
            isGraded: false
        }));
        
        renderExam();
        saveCurrentState();
    }

    function renderExam() {
        document.getElementById('setup-card').classList.add('hidden');
        document.getElementById('exam-card').classList.remove('hidden');
        
        document.getElementById('exam-title').textContent = isReviewMode ? "🔥 錯題特訓重測模式" : "📝 線上隨機模擬考試";
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        const isInstant = document.getElementById('feedback-select').value === 'instant';
        document.getElementById('submit-exam-btn').classList.toggle('hidden', isInstant);

        currentExamQuestions.forEach((q, idx) => {
            const qEl = document.createElement('div');
            qEl.className = 'question-item';
            qEl.id = `q-box-${idx}`;
            
            const textA = cleanOptionText('A', q.a);
            const textB = cleanOptionText('B', q.b);
            const textC = cleanOptionText('C', q.c);
            const textD = cleanOptionText('D', q.d);

            const sourceText = getPaperSource(q) === 'paper1' ? '考古題 1' : '考古題 2';

            qEl.innerHTML = `
                <div>
                    <span class="paper-tag">${sourceText}</span>
                    <span class="course-tag">${q.course || '綜合'}</span>
                </div>
                <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 5px;">題號：${q.id}</div>
                <div class="question-title">${idx + 1}. ${q.title}</div>
                <div class="options-list">
                    <label class="option-label" id="label-${idx}-A"><input type="radio" name="q-${idx}" value="A" ${q.userAns==='A'?'checked':''} onchange="selectAnswer(${idx}, 'A')"> <strong>(A)</strong> ${textA}</label>
                    <label class="option-label" id="label-${idx}-B"><input type="radio" name="q-${idx}" value="B" ${q.userAns==='B'?'checked':''} onchange="selectAnswer(${idx}, 'B')"> <strong>(B)</strong> ${textB}</label>
                    <label class="option-label" id="label-${idx}-C"><input type="radio" name="q-${idx}" value="C" ${q.userAns==='C'?'checked':''} onchange="selectAnswer(${idx}, 'C')"> <strong>(C)</strong> ${textC}</label>
                    <label class="option-label" id="label-${idx}-D"><input type="radio" name="q-${idx}" value="D" ${q.userAns==='D'?'checked':''} onchange="selectAnswer(${idx}, 'D')"> <strong>(D)</strong> ${textD}</label>
                </div>
                <div class="analysis-box hidden" id="analysis-${idx}">
                    <strong>標準答案：【${q.ans.trim().toUpperCase()}】</strong><br>
                </div>
            `;
            container.appendChild(qEl);

            if (q.isGraded || (isInstant && q.userAns)) {
                revealSingleQuestion(idx);
            }
        });

        updateStats();
    }

    function selectAnswer(idx, ans) {
        currentExamQuestions[idx].userAns = ans;
        const isInstant = document.getElementById('feedback-select').value === 'instant';
        const q = currentExamQuestions[idx];
        
        if (isInstant) {
            revealSingleQuestion(idx);
            if (ans === q.ans.trim().toUpperCase()) {
                wrongQuestionPool.delete(q.uniqueId);
            } else {
                wrongQuestionPool.add(q.uniqueId);
            }
            updateWrongButtonState();
        }
        
        updateStats();
        saveCurrentState();
    }

    function revealSingleQuestion(idx) {
        const q = currentExamQuestions[idx];
        const options = ['A', 'B', 'C', 'D'];
        const targetAns = q.ans.trim().toUpperCase();
        
        options.forEach(opt => {
            const lbl = document.getElementById(`label-${idx}-${opt}`);
            if (lbl) {
                lbl.classList.remove('option-correct', 'option-wrong');
                if (opt === targetAns) {
                    lbl.classList.add('option-correct');
                } else if (q.userAns === opt && opt !== targetAns) {
                    lbl.classList.add('option-wrong');
                }
            }
        });

        document.getElementById(`analysis-${idx}`).classList.remove('hidden');
    }

    function gradeEntireExam() {
        currentExamQuestions.forEach((q, idx) => {
            q.isGraded = true;
            revealSingleQuestion(idx);

            if (q.userAns === q.ans.trim().toUpperCase()) {
                wrongQuestionPool.delete(q.uniqueId); 
            } else {
                wrongQuestionPool.add(q.uniqueId); 
            }
        });
        
        updateStats();
        updateWrongButtonState();
        saveCurrentState();
        alert("整卷批改完成！錯題複習本已即時動態同步。");
    }

    function updateStats() {
        const total = currentExamQuestions.length;
        const answered = currentExamQuestions.filter(q => q.userAns !== null).length;
        const correct = currentExamQuestions.filter(q => q.userAns === q.ans.trim().toUpperCase()).length;

        document.getElementById('stat-total').textContent = total;
        document.getElementById('stat-answered').textContent = answered;
        document.getElementById('stat-correct').textContent = correct;
        document.getElementById('stat-wrong-pool').textContent = wrongQuestionPool.size;
    }

    function updateWrongButtonState() {
        const count = wrongQuestionPool.size;
        document.getElementById('wrong-count-txt').textContent = count;
        document.getElementById('review-btn').disabled = (count === 0);
    }

    function backToSetup() {
        document.getElementById('exam-card').classList.add('hidden');
        document.getElementById('setup-card').classList.remove('hidden');
    }

    function saveCurrentState() {
        localStorage.setItem('wrong_pool', JSON.stringify([...wrongQuestionPool]));
        localStorage.setItem('last_exam_questions', JSON.stringify(currentExamQuestions));
        localStorage.setItem('exam_settings', JSON.stringify({
            mode: document.getElementById('mode-select').value,
            count: document.getElementById('count-select').value,
            feedback: document.getElementById('feedback-select').value
        }));
    }

    function loadLocalStorage() {
        const wp = localStorage.getItem('wrong_pool');
        if (wp) wrongQuestionPool = new Set(JSON.parse(wp));

        const lastActive = localStorage.getItem('last_exam_questions');
        if (lastActive && JSON.parse(lastActive).length > 0) {
            document.getElementById('resume-btn').disabled = false;
        } else {
            document.getElementById('resume-btn').disabled = true;
        }
    }

    function resumeLastExam() {
        const lastActive = localStorage.getItem('last_exam_questions');
        const settings = localStorage.getItem('exam_settings');
        if (lastActive && settings) {
            const setObj = JSON.parse(settings);
            document.getElementById('mode-select').value = setObj.mode;
            document.getElementById('count-select').value = setObj.count;
            document.getElementById('feedback-select').value = setObj.feedback;

            currentExamQuestions = JSON.parse(lastActive);
            const hasReviewTitle = currentExamQuestions.every(q => wrongQuestionPool.has(q.uniqueId));
            isReviewMode = (setObj.mode !== 'all' && setObj.mode !== 'paper1' && setObj.mode !== 'paper2' && hasReviewTitle);
            
            renderExam();
        }
    }
</script>

</body>
</html>
